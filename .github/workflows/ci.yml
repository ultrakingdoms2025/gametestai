# Continuous integration for AETHER NEXUS.
#
# Until this file existed there was no CI at all: 190 test files, ~2,570 tests,
# a vitest suite and a 114-file contract checker, none of which ran on a push.
# The deployed game is a hand-committed bundle, and `bundle-game.mjs` ran with
# `--if-available`, so a broken build exited zero and shipped the previous
# bundle. The commit history records that happening.
#
# That flag is gone as of the September 2026 audit remediation: every failure
# mode in `site/scripts/bundle-game.mjs` is now fatal, the site's `build` script
# passes no flag, and the one remaining soft case (no game project at `..` at
# all) is refused outright whenever `VERCEL` is set. The site is a SEPARATE
# Vercel project from the game, so nothing in this file was ever going to catch
# its deploy shipping stale — the script had to be the one to fail.
#
# Nothing here deploys — Vercel's git integration owns that. These jobs only
# decide whether a push should have been allowed to reach it.
#
# `contract-check` is a SEPARATE step because it is deliberately not part of
# `npm test`: most of the codebase touches `document` or WebGL at module scope
# and cannot be imported under Node, so the checker verifies the API surface
# textually instead.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # So the perf job — which is skipped on a plain branch push, see its `if` —
  # can still be run on demand against a work-in-progress branch.
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: Game — tests, contracts, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 3,893 tests across ~190 files as of 2026-09-01 (it was ~2,570 when this
      # job was written). Takes roughly six minutes on this runner.
      - name: Unit tests
        run: npm test

      # Not covered by `npm test` — see the note at the top of this file.
      - name: Contract check
        run: node scripts/contract-check.mjs

      # The bundle that ships is committed by hand, so a build that fails here
      # is a build that would have shipped stale. Fail the push instead.
      - name: Production build
        run: npx vite build

      # Eighty-eight layouts: six viewport sizes x fifteen interface states,
      # measured in real Chrome against a Vite dev server on a fresh port. It is
      # separate from `npm test` because it needs a browser and a server;
      # `npm test` still carries the source half of the same contract.
      #
      # It was five states until 2026-08-25, and the ten panels outside those
      # five were measured at no viewport at all - which is how the quest board
      # shipped with `280px 1fr` and `overflow: hidden` and no media query. The
      # first run at fifteen states reported 1495 failures against CSS that had
      # not changed. Each panel scene throws if its panel did not open, so a
      # scene cannot pass by measuring a blank viewport.
      #
      # No `playwright install`: the runner image ships google-chrome, the
      # probe finds it on PATH, and the whole thing talks CDP over Node 22's
      # built-in WebSocket rather than adding a dependency. If no browser is
      # found the probe FAILS rather than skipping - a gate that quietly
      # measures nothing is the failure shape this project keeps paying for.
      - name: HUD layout
        run: npm run test:layout

  # ── THE PERFORMANCE GATE ───────────────────────────────────────────────
  #
  # Until this job existed nothing in CI measured a frame. Every number backing
  # the Phase 1 acceptance criterion came from a hand-run of `frame-gaps.mjs` on
  # one developer's machine, so a regression in world entry, mount launch or
  # world traversal shipped in silence and was found, if at all, by playing.
  # The map editor's ground sampler (`--layout-sample`) was tried inside this
  # gated measurement on 2026-08-28 (run 33177408325) and withdrawn the same
  # day: it casts for at most 2 ms per RENDERED frame so that its cost shows
  # up in the frame gaps, and this runner rendered 32 frames in the 625 s
  # layout window (seven 10 s stretches with no frame at all). 62 001 cells
  # cannot finish in 32 frames at any fuse, so the gate would fail forever on
  # a fact about the runner, not the game. The sampler's cost is evidenced by
  # hand runs (.probe/map-editor-stage2/perf.md); measuring it here needs a
  # runner that renders (a GPU, or a non-starved rasteriser).
  #
  # IT DOES NOT ASSERT MILLISECONDS, AND THAT IS THE DESIGN. The long note on
  # `BASELINES` in `scripts/frame-gaps.mjs` carries the full argument; the short
  # version is that this repository's most expensive recurring mistake is a gate
  # that measures something the game does not do. A clock gate here would be
  # exactly that:
  #
  #   * A headless window that Windows or the compositor decides is occluded
  #     stops delivering animation frames and nothing else, and is recorded as
  #     one enormous frame gap over an IDLE main thread. Two of the twelve rows
  #     in the baseline runs taken for this job came back STARVED on a machine
  #     with all four suppression flags in force.
  #   * This runner has no GPU. SwiftShader's absolute times are unrelated to a
  #     player's, so a threshold picked here would be arbitrary.
  #   * Six worlds are over the 250 ms budget TODAY. A clock gate would fail on
  #     the first push and be commented out by the second.
  #
  # What it does assert survives all three: INVARIANTS (was the game actually
  # measured — did the background world chain finish, did the boot warm run,
  # was every world built before the player entered it, did the player actually
  # MOVE during the movement phases, did an interaction leave the keyboard
  # captured) and COUNTERS (shader programs linked per event, and by the boot
  # warm). Program counts come from three.js's own cache key, not from the
  # driver, so they travel between machines in a way that times do not.
  #
  # On a platform with no recorded baseline — which linux-swiftshader is until
  # someone pastes in the block this prints — the counter half passes with a
  # notice and the invariant half still gates. A gate that failed on numbers it
  # had never seen would flake on its first run, which is the same disease.
  #
  # NOT ON EVERY PUSH. It builds the bundle, boots the game, waits out the
  # background world chain and then enters and walks each gated world, which is
  # tens of minutes of runner time. Pull requests and main are where a
  # regression matters; a work-in-progress branch push is not worth it.
  perf:
    name: Perf — frame-gap counters and invariants
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Same browser discovery as the HUD probe: the runner image ships
      # google-chrome and `browserCandidates()` finds it. If it ever does not,
      # the script FAILS with "NO BROWSER FOUND - this harness measured
      # nothing" rather than skipping, which is the only acceptable behaviour
      # for a gate.
      #
      # `--settle` is four times the local default because the boot warm on a
      # software rasteriser is several times slower than on a GPU, and a warm
      # that times out makes every figure after it cold — which the gate would
      # then report as a regression instead of as too short a fuse.
      #
      # `--worlds` IS A SCOPE, AND IT IS NOT THE ONE ANYONE WANTS. The default
      # is every registered world; run that way with movement on, locally, and
      # the renderer DIED partway through - eighteen worlds built, then eight
      # seconds of held movement in each of them, streaming districts resident
      # and waking NPCs as it went. The harness now fails loudly when that
      # happens instead of hanging (see `die` in the CDP client), but a gate
      # that can take the browser down is a gate that gets disabled.
      #
      # So it gates the six worlds the Phase 1 criterion is actually failing on
      # plus the station it boots into. Widening this to the full set is real
      # remaining work and it is blocked on that crash, not on this file - the
      # background chain still BUILDS every world in every run, so a regression
      # in a world not listed here still shows up in `warm.programs` and in the
      # chain's own counters.
      # COLD, because the chain was MEASURED and it does not fit. The maiden
      # run died on the chain wait's hardcoded fuse after fifteen silent
      # minutes; the fuse became a knob and a timeout now prints its
      # progress, and the very next measurement used that to answer the real
      # question: under swiftshader the 18-world background chain built
      # 3 of 17 non-volatile worlds in 40 MINUTES (station, medieval,
      # sports - 267 programs). ~13 min/world means the full chain is hours.
      # No fuse fixes that; the shape was wrong for this runner.
      #
      # So CI gates COLD: boot warm, keybind, weapon, mount, movement and
      # interaction in the entry world - everything the criterion names that
      # needs no chain - plus page errors and the warm/program counters.
      # World-entry regressions are NOT covered here, deliberately and
      # loudly (`--cold --gate` refuses entry events rather than mis-judging
      # them); the full chain-warmed entry gate remains a local or
      # workflow_dispatch run on real hardware, where it takes minutes.
      #
      # ENFORCING since 2026-08-26: the first green run (32928309409) proved
      # the shape - ~6 min of gate inside a 15-min job - and its printed
      # baseline (warmPrograms 111) is recorded in `BASELINES` under
      # `linux-swiftshader`, in the same commit that removed
      # `continue-on-error`, per the rule written when it was added. That run
      # also confirmed movement/interaction pass on this runner, and that its
      # watchdog sees 10 s no-rAF stretches - the clock stays printed, never
      # asserted.
      #
      # `--layout-sample` is deliberately NOT passed here. It was added on
      # 2026-08-28 (d828053) and withdrawn after run 33177408325: the layout
      # phase saw 32 frames in 625 s on this runner and the frame-driven
      # sampler reached no useful fraction of station's 62 001 cells; `--gate`
      # then fails honestly on `layoutSampled: false` - forever, on this runner.
      # The cold base on an RTX 5080 finishes the same world in 34 s at ~9 fps
      # with the chain competing. Re-add the flag only on a runner that renders;
      # do not widen `--layout-timeout` past a fuse that frames can satisfy.
      - name: Frame-gap gate (cold)
        env:
          FRAME_GAPS_GL: swiftshader
        run: >
          node scripts/frame-gaps.mjs --serve prod --gate --cold
          --entry station --worlds station
          --events keybind,weapon,mount,interaction,movement
          --settle 960000
          --out .probe/ci-frame-gaps

      # The run's own JSON, whatever the verdict. A failure that cannot be read
      # afterwards gets rerun until it goes green, which is how a gate becomes
      # a coin toss.
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-gaps
          path: .probe/ci-frame-gaps
          if-no-files-found: warn

  # ── THE STOREFRONT ─────────────────────────────────────────────────────
  #
  # The site is a SEPARATE Vercel project from the game and from the admin app,
  # with its own lockfile, its own build and its own deploy trigger. Nothing in
  # the `game` job above touches a line of it. This job is the only thing that
  # looks at the code holding the account system, the paywall and the Stripe
  # integration before it ships.
  site:
    name: Site — types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # NOT `--omit=dev`: vitest, jsdom and Testing Library are devDependencies,
      # and the step below is the whole reason this job exists.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # TWO PROJECTS, both of which must find files — see `vitest.config.mts`
      # for why the environment follows the file rather than the config.
      #
      #   * `server` — `lib/**`, `components/**/*.test.ts` and `app/**/*.test.ts`
      #     under Node, which is where route handlers and library code actually
      #     run. `app/**` was outside the include list entirely until the
      #     September 2026 audit, so checkout, webhook, confirm, restore,
      #     redeem, register, reset-password and setup-2fa had no reachable
      #     test between them.
      #   * `dom` — `**/*.test.tsx` under jsdom with Testing Library. There was
      #     not one `.test.tsx` in the repository before that audit, which is
      #     precisely how a React batching bug survived in
      #     `MarketplaceAdminPanel`: it set a success message and clobbered it
      #     in the same tick, and no test that never renders a component can
      #     see that.
      #
      # `passWithNoTests` is set on NEITHER, so a typo in either glob is a red
      # build rather than a green run over zero files.
      #
      # WHAT THIS DELIBERATELY DOES NOT COVER, so nobody reads it as more than
      # it is: there is no database here. The route-handler tests exercise
      # handlers as functions against fakes, not over HTTP against Postgres, so
      # a schema drift, a migration that never ran, or an `initSchema()` the
      # admin app owns and the site assumes will not be caught by this job — it
      # will be caught in production. There is also no browser: `next build` is
      # not run here (Vercel runs it on the deploy) and no page is rendered for
      # real, so a client/server boundary error that only Next's compiler sees
      # reaches the deploy before it reaches anyone.
      - name: Unit tests
        run: npx vitest run

  # ── THE ADMIN APP ──────────────────────────────────────────────────────
  #
  # Third separate Vercel project, third separate lockfile. It owns the
  # `players` table both other projects read, the audit chain, and the
  # marketplace and quest content the game serves — so a break here is not
  # confined to an internal tool.
  admin:
    name: Admin — types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      # THERE IS STILL NO ADMIN TEST SUITE, and this step is not pretending to
      # be one. `find admin -name '*.test.ts*'` returns nothing and there is no
      # `test` script and no test runner in `admin/package.json`, so there is
      # nothing here for a step to run. A `run: npm test --if-present` would go
      # green having executed nothing at all, which is the exact shape this
      # repository has been burned by and is worse than the honest gap.
      #
      # What the typecheck does buy, given `strict: true`: session handling,
      # the zod-validated route inputs, and the generated quest vocabulary all
      # fail the build on a shape change. What it does not buy is any statement
      # about behaviour — an authorisation check inverted, a throttle that
      # never throttles, or an audit row written with the wrong chain hash all
      # typecheck perfectly.
      #
      # Closing that needs a runner and a first test in `admin/package.json`,
      # which is a change to a file this remediation did not own. When one
      # lands, add the step here next to the typecheck, not instead of it.
      - name: Typecheck
        run: npx tsc --noEmit
