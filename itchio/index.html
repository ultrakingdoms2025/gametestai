<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://aethernexus.games/">
  <title>AETHER NEXUS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070c12;
      color: #eafcff;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    main { padding: 32px; }
    h1 {
      margin: 0 0 12px;
      color: #54eaff;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: .16em;
    }
    p { color: #9bb2c2; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border: 1px solid #54eaff;
      color: #eafcff;
      text-decoration: none;
    }
    a:hover { background: #123247; }
  </style>
</head>
<body>
  <main>
    <h1>AETHER NEXUS</h1>
    <p>Opening the gateway...</p>
    <a href="https://aethernexus.games/">Continue to Aether Nexus</a>
  </main>
  <script>
    window.location.replace('https://aethernexus.games/');
  </script>
</body>
</html>
