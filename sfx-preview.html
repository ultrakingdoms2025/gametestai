<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Nexus — SFX Audition</title>
<style>
  :root { --bg:#0b0e14; --panel:#131826; --ink:#e8ecf4; --dim:#8b93a7; --line:#232a3d; --hot:#5eead4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
         color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; padding:30px 18px 120px; }
  header { text-align:center; margin-bottom:6px; }
  header h1 { font-size:24px; letter-spacing:.16em; font-weight:600; }
  header .sub { color:var(--dim); margin-top:5px; font-size:13px; }
  .wrap { max-width:1060px; margin:0 auto; }
  h2.group { margin:30px 4px 10px; font-size:13px; letter-spacing:.24em; color:var(--hot);
             text-transform:uppercase; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .fx { background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:14px 16px; margin-bottom:10px; }
  .fx .head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .fx h3 { font-size:16px; }
  .fx .desc { color:var(--dim); font-size:12px; }
  .vars { display:grid; grid-template-columns:repeat(auto-fit,minmax(186px,1fr)); gap:8px; margin-top:10px; }
  .var { background:#0f1420; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
         cursor:pointer; transition:border-color .15s, box-shadow .15s; position:relative; }
  .var:hover { border-color:#3b4663; }
  .var.picked { border-color:var(--hot); box-shadow:0 0 14px -6px var(--hot); }
  .var .lab { font-weight:700; font-size:13px; }
  .var .lab .letter { color:var(--hot); margin-right:6px; }
  .var .det { color:var(--dim); font-size:11.5px; margin-top:3px; line-height:1.35; min-height:28px; }
  .var .row { display:flex; gap:6px; margin-top:7px; }
  .var button { border:0; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .var .play { background:#26304a; color:var(--ink); }
  .var .play:hover { background:#33405f; }
  .var .pick { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .var.picked .pick { background:var(--hot); color:#0b0e14; border-color:var(--hot); }
  #bar { position:fixed; left:0; right:0; bottom:0; background:#0e1322ee; border-top:1px solid var(--line);
         backdrop-filter:blur(6px); padding:10px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  #bar .sum { flex:1; font-size:12px; color:var(--dim); min-width:200px; }
  #bar .sum b { color:var(--ink); font-weight:600; }
  #bar button { background:var(--hot); color:#0b0e14; border:0; border-radius:8px; padding:8px 18px;
                font-weight:700; font-size:13px; cursor:pointer; }
  #meter { width:120px; height:8px; background:#0f1420; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  #meterfill { height:100%; width:0%; background:linear-gradient(90deg,#2dd4bf,#f59e0b,#ef4444); }
</style>
</head>
<body>
<header>
  <h1>AETHER NEXUS — SFX AUDITION</h1>
  <div class="sub">Five ultra-realistic synthesized candidates per effect. Play each, hit ✓ Pick on your favourite, then Copy Selections.</div>
</header>
<div class="wrap" id="wrap"></div>

<div id="bar">
  <div id="meter"><div id="meterfill"></div></div>
  <div class="sum" id="sum">No picks yet.</div>
  <button id="copy">Copy selections</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   AETHER NEXUS — SFX audition bench.
   Every candidate is pure Web Audio synthesis (no assets), written in the
   same house style as src/audio/Sfx.js so the chosen recipes port directly.
   ═══════════════════════════════════════════════════════════════════════ */

let ctx=null, master, comp, analyser, noiseBuf, verb, verbSend;
function AC(){
  if(ctx){ if(ctx.state==='suspended')ctx.resume(); return ctx; }
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  master=ctx.createGain(); master.gain.value=0.8;
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12; comp.knee.value=10; comp.ratio.value=10;
  comp.attack.value=0.002; comp.release.value=0.18;
  analyser=ctx.createAnalyser(); analyser.fftSize=1024;
  master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
  const L=Math.floor(ctx.sampleRate*1.8), imp=ctx.createBuffer(2,L,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=imp.getChannelData(c);
    for(let i=0;i<L;i++){ const p=i/L; d[i]=(Math.random()*2-1)*Math.pow(1-p,2.4)*(1-0.35*p); } }
  verb=ctx.createConvolver(); verb.buffer=imp;
  const vg=ctx.createGain(); vg.gain.value=0.7;
  verbSend=ctx.createGain(); verbSend.connect(verb); verb.connect(vg); vg.connect(master);
  const NL=ctx.sampleRate*2; noiseBuf=ctx.createBuffer(1,NL,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<NL;i++)nd[i]=Math.random()*2-1;
  return ctx;
}
const rnd=(a,b)=>a+Math.random()*(b-a);

function env(t,dur,g,a){
  const e=ctx.createGain();
  e.gain.setValueAtTime(0.0001,t);
  e.gain.exponentialRampToValueAtTime(Math.max(g,0.0002),t+Math.max(a,0.002));
  e.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  e.connect(master); return e;
}
function rvb(node,amt){ if(amt<=0)return; const s=ctx.createGain(); s.gain.value=amt; node.connect(s); s.connect(verbSend); }

/** Filtered noise burst. o:{dur,f,to,ft,q,g,a,rate,slide,rvb} */
function N(t,o){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  s.playbackRate.value=o.rate??1;
  const f=ctx.createBiquadFilter(); f.type=o.ft||'bandpass'; f.Q.value=o.q??1;
  f.frequency.setValueAtTime(o.f,t);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+(o.slide??o.dur));
  const e=env(t,o.dur,o.g,o.a??0.002);
  s.connect(f); f.connect(e); rvb(e,o.rvb??0);
  s.start(t); s.stop(t+o.dur+0.05);
  return {f,e,s};
}
/** Tone. o:{dur,w,f,to,g,a,lp,slide,rvb,det} */
function T(t,o){
  const os=ctx.createOscillator(); os.type=o.w||'sine';
  os.frequency.setValueAtTime(o.f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+(o.slide??o.dur));
  if(o.det)os.detune.value=o.det;
  let last=os;
  if(o.lp){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; os.connect(f); last=f; }
  const e=env(t,o.dur,o.g,o.a??0.004);
  last.connect(e); rvb(e,o.rvb??0);
  os.start(t); os.stop(t+o.dur+0.05);
  return {os,e};
}
/** Wire a build callback through a tanh waveshaper of drive k. */
function shaped(t,k,build){
  const sh=ctx.createWaveShaper(); const n=512, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/Math.tanh(k); }
  sh.curve=c; return build(sh);
}
/** Micro-grain cluster (gravel, embers, rustle). */
function grains(t,o){
  for(let i=0;i<o.count;i++){
    const at=t+Math.random()*o.span;
    N(at,{dur:o.dur??0.02,f:o.f*rnd(0.7,1.4),ft:o.ft||'bandpass',q:o.q??2,g:o.g*rnd(0.5,1),a:0.001,rvb:o.rvb??0});
  }
}

/* ── family generators ─────────────────────────────────────────────── */

function footstep(t,p){
  switch(p.kind){
    case 'scuff':
      N(t,{dur:.05,f:p.f??1100,to:(p.f??1100)*.45,q:.8,g:p.g,a:.002,rvb:.06});
      T(t,{dur:.07,f:p.th??110,to:(p.th??110)*.6,g:p.g*.8,lp:300});
      N(t+p.gap,{dur:.04,f:(p.f??1100)*.8,to:(p.f??1100)*.4,q:.9,g:p.g*.55,a:.002});
      break;
    case 'gravel':
      grains(t,{count:9,span:.09,dur:.018,f:1500,q:2.2,g:p.g*.5});
      T(t+.01,{dur:.08,f:95,to:60,g:p.g*.7,lp:260});
      grains(t+p.gap,{count:5,span:.06,dur:.015,f:1700,q:2.2,g:p.g*.3});
      break;
    case 'grass':
      N(t,{dur:.09,f:900,to:400,ft:'lowpass',g:p.g*.8,a:.012,rvb:.03});
      T(t,{dur:.08,f:85,to:55,g:p.g*.5,lp:220});
      N(t+p.gap,{dur:.06,f:750,ft:'lowpass',g:p.g*.4,a:.01});
      break;
    case 'wood':
      T(t,{dur:.11,f:p.res??155,to:(p.res??155)*.8,g:p.g,lp:600,rvb:.1});
      N(t,{dur:.025,f:1300,q:1.4,g:p.g*.5,a:.001});
      T(t+p.gap,{dur:.08,f:(p.res??155)*1.18,g:p.g*.5,lp:600});
      break;
    case 'squeak':
      T(t,{dur:.08,f:70,g:p.g*.9,lp:200});
      if(Math.random()<.45)T(t+.02,{dur:.06,w:'sine',f:2300,to:3100,g:p.g*.16,a:.008});
      N(t+p.gap,{dur:.03,f:1200,q:1,g:p.g*.3});
      break;
  }
}
function stepDemo(p,steps,space){
  const t0=AC().currentTime+.05;
  for(let i=0;i<steps;i++){
    const jit=rnd(-.02,.02), gv=p.g*rnd(.85,1.1);
    footstep(t0+i*space+jit,{...p,g:gv});
  }
}

function swimStroke(t,p){
  N(t,{dur:p.dur??.5,f:p.f??700,to:(p.f??700)*.5,q:.6,g:p.g,a:p.a??.05,rvb:.12});
  if(p.drops)for(let i=0;i<5;i++)
    T(t+.12+Math.random()*.3,{dur:.035,f:rnd(500,1200),g:p.g*.22,a:.002,rvb:.15});
  if(p.bubbles)for(let i=0;i<6;i++){
    const bt=t+.05+Math.random()*.4, bf=rnd(350,700);
    T(bt,{dur:.06,f:bf,to:bf*2.2,g:p.g*.18,a:.004});
  }
  if(p.crash)N(t,{dur:.18,f:2600,ft:'highpass',g:p.g*.4,a:.004,rvb:.2});
}

function roar(t,p){
  shaped(t,p.drive??6,(sh)=>{
    const os=ctx.createOscillator(); os.type='sawtooth';
    os.frequency.setValueAtTime(p.f,t);
    os.frequency.exponentialRampToValueAtTime(p.f*(p.fall??0.62),t+p.dur*.85);
    const os2=ctx.createOscillator(); os2.type='sawtooth';
    os2.frequency.setValueAtTime(p.f*(p.twin??1.5),t);
    os2.frequency.exponentialRampToValueAtTime(p.f*(p.twin??1.5)*.6,t+p.dur*.85);
    const g2=ctx.createGain(); g2.gain.value=p.twin?0.6:0.0001;
    const am=ctx.createGain(); am.gain.value=1;
    const lfo=ctx.createOscillator(); lfo.frequency.value=p.growl??15;
    const lg=ctx.createGain(); lg.gain.value=.35; lfo.connect(lg); lg.connect(am.gain);
    os.connect(sh); os2.connect(g2); g2.connect(sh);
    sh.connect(am);
    const mix=ctx.createGain(); mix.gain.value=1;
    for(const fq of [[240,1.1,.9],[620,1.4,.7],[1150,2,.4]]){
      const b=ctx.createBiquadFilter(); b.type='bandpass'; b.frequency.value=fq[0]*(p.formant??1); b.Q.value=fq[1];
      const bg=ctx.createGain(); bg.gain.value=fq[2]; am.connect(b); b.connect(bg); bg.connect(mix);
    }
    const e=env(t,p.dur,p.g,p.a??.06); mix.connect(e); rvb(e,.4);
    os.start(t); os.stop(t+p.dur+.1); os2.start(t); os2.stop(t+p.dur+.1);
    lfo.start(t); lfo.stop(t+p.dur+.1);
  });
  N(t,{dur:p.dur*.9,f:900,to:400,q:.7,g:p.g*.45,a:.05,rvb:.3,rate:.8});
  if(p.embers)grains(t+p.dur*.3,{count:14,span:p.dur*.6,dur:.02,f:2600,q:3,g:p.g*.2,rvb:.2});
}

function flap(t,p){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.playbackRate.value=.9;
  const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8;
  f.frequency.setValueAtTime(300,t);
  f.frequency.exponentialRampToValueAtTime(p.peak??1400,t+p.dur*.4);
  f.frequency.exponentialRampToValueAtTime(260,t+p.dur);
  const e=env(t,p.dur,p.g,p.dur*.3); s.connect(f); f.connect(e); rvb(e,.15);
  s.start(t); s.stop(t+p.dur+.05);
}
function screech(t,p){
  shaped(t,3.5,(sh)=>{
    const os=ctx.createOscillator(); os.type='sawtooth';
    os.frequency.setValueAtTime(p.f,t);
    if(p.up)os.frequency.exponentialRampToValueAtTime(p.f*1.3,t+p.dur*.25);
    os.frequency.exponentialRampToValueAtTime(p.f*(p.fall??.55),t+p.dur);
    const v=ctx.createOscillator(); v.frequency.value=p.trill||6;
    const vg=ctx.createGain(); vg.gain.value=p.trill?120:0; v.connect(vg); vg.connect(os.detune);
    const b=ctx.createBiquadFilter(); b.type='bandpass'; b.frequency.value=p.band??2100; b.Q.value=1.6;
    os.connect(sh); sh.connect(b);
    const e=env(t,p.dur,p.g,.015); b.connect(e); rvb(e,p.rvb??.35);
    os.start(t); os.stop(t+p.dur+.05); v.start(t); v.stop(t+p.dur+.05);
  });
}

function clop(t,p){
  T(t,{dur:.055,f:p.f,to:p.f*.5,g:p.g,a:.001,lp:p.lp??2400,rvb:p.rvb??.08});
  N(t,{dur:.02,f:p.nf??1900,q:2,g:p.g*.45,a:.001});
  if(p.body)T(t+.004,{dur:.09,f:130,to:75,g:p.g*.6,lp:300});
}
function gallopDemo(p){
  const t0=AC().currentTime+.05, cyc=p.cycle??.5;
  /* transverse gallop: three beats and a suspension */
  const beats=[0,.14,.28,.40];
  for(let c=0;c<4;c++)for(let i=0;i<beats.length;i++){
    if(i===3&&c%2===0)continue;
    clop(t0+c*cyc+beats[i]*cyc/.5,{...p,g:p.g*rnd(.8,1.1),f:p.f*rnd(.95,1.06)});
  }
}

function engineDemo(p){
  const t=AC().currentTime+.05, D=3.0;
  const out=ctx.createGain();
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(p.g,t+.25);
  out.gain.setValueAtTime(p.g,t+D-.4);
  out.gain.exponentialRampToValueAtTime(0.0001,t+D);
  out.connect(master);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(p.lp0??900,t);
  lp.frequency.exponentialRampToValueAtTime(p.lp1??2400,t+D*.6);
  lp.frequency.exponentialRampToValueAtTime((p.lp0??900)*1.2,t+D);
  lp.connect(out);
  for(const h of p.harm){
    const o=ctx.createOscillator(); o.type=h[2];
    o.frequency.setValueAtTime(p.f0*h[0],t);
    o.frequency.exponentialRampToValueAtTime(p.f1*h[0],t+D*.6);
    o.frequency.exponentialRampToValueAtTime(p.f0*h[0]*1.15,t+D);
    const og=ctx.createGain(); og.gain.value=h[1];
    o.connect(og); og.connect(lp);
    o.start(t); o.stop(t+D+.05);
  }
  if(p.whine){
    const w=ctx.createOscillator(); w.type='sine';
    w.frequency.setValueAtTime(p.whine[0],t);
    w.frequency.exponentialRampToValueAtTime(p.whine[1],t+D*.6);
    w.frequency.exponentialRampToValueAtTime(p.whine[0]*1.2,t+D);
    const wg=ctx.createGain(); wg.gain.value=p.whine[2];
    w.connect(wg); wg.connect(out); w.start(t); w.stop(t+D+.05);
  }
  if(p.airG){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const bf=ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=p.airF??1200; bf.Q.value=.7;
    const sg=ctx.createGain(); sg.gain.value=p.airG;
    s.connect(bf); bf.connect(sg); sg.connect(out);
    s.start(t); s.stop(t+D+.05);
  }
  if(p.crackle)grains(t+D*.55,{count:16,span:.7,dur:.02,f:900,q:1.5,g:p.g*.5});
}

function humDemo(p){
  const t=AC().currentTime+.05, D=3.0;
  const out=ctx.createGain();
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(p.g,t+.4);
  out.gain.setValueAtTime(p.g,t+D-.5);
  out.gain.exponentialRampToValueAtTime(0.0001,t+D);
  out.connect(master);
  for(const vv of p.voices){
    const o=ctx.createOscillator(); o.type=vv[1];
    o.frequency.setValueAtTime(vv[0],t);
    o.frequency.exponentialRampToValueAtTime(vv[0]*(p.rise??1.6),t+D*.6);
    o.frequency.exponentialRampToValueAtTime(vv[0]*1.1,t+D);
    if(vv[3])o.detune.value=vv[3];
    const og=ctx.createGain(); og.gain.value=vv[2];
    let last=o;
    if(p.lp){ const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=p.lp; fl.Q.value=p.q??3; o.connect(fl); last=fl; }
    last.connect(og); og.connect(out);
    o.start(t); o.stop(t+D+.05);
  }
  if(p.am){
    const l=ctx.createOscillator(); l.frequency.value=p.am;
    const lg=ctx.createGain(); lg.gain.value=p.g*.5;
    l.connect(lg); lg.connect(out.gain); l.start(t); l.stop(t+D+.05);
  }
  if(p.airG){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const bf=ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=p.airF??2400; bf.Q.value=.8;
    const sg=ctx.createGain(); sg.gain.value=p.airG;
    s.connect(bf); bf.connect(sg); sg.connect(out);
    s.start(t); s.stop(t+D+.05);
  }
}

function bikeDemo(p){
  AC();
  const t=ctx.currentTime+.05, D=3.0;
  let at=t, rate=p.rate0??8;
  while(at<t+D){
    T(at,{dur:.012,w:'square',f:(p.click??3400)*rnd(.96,1.04),g:p.g*rnd(.7,1),a:.001});
    if(p.dbl)T(at+.011,{dur:.01,w:'square',f:(p.click??3400)*.8,g:p.g*.5,a:.001});
    rate=Math.min(p.rate1??22,rate*1.02);
    at+=1/rate;
  }
  if(p.whirG){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const bf=ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=p.whirF??900; bf.Q.value=1.2;
    const e=env(t,D,p.whirG,.4); s.connect(bf); bf.connect(e);
    s.start(t); s.stop(t+D+.05);
  }
  if(p.rattle)grains(t,{count:26,span:D,dur:.014,f:2100,q:2.5,g:p.g*.4});
}

function sword(t,p){
  N(t,{dur:p.dur??.16,f:p.f0??420,to:p.f1??2600,q:1.6,g:p.g,a:.008,slide:(p.dur??.16)*.55,rvb:.08});
  if(p.low)T(t,{dur:.14,f:150,to:90,g:p.g*.5,lp:400});
  if(p.ring){ T(t+.02,{dur:1.1,f:2650,g:p.g*.10,a:.003,rvb:.3}); T(t+.02,{dur:.9,f:3950,g:p.g*.05,a:.003,rvb:.3}); }
  if(p.dbl)N(t+.17,{dur:.13,f:520,to:2900,q:1.6,g:p.g*.8,a:.006,slide:.07});
}
function bow(t,p){
  if(p.creak){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.playbackRate.value=.35;
    const b=ctx.createBiquadFilter(); b.type='bandpass'; b.frequency.value=620; b.Q.value=5;
    const e=env(t,.3,p.g*.25,.06); s.connect(b); b.connect(e);
    s.start(t); s.stop(t+.35);
  }
  const rel=t+(p.creak?.32:0);
  T(rel,{dur:.5,w:'triangle',f:p.tw??150,to:(p.tw??150)*.96,g:p.g,a:.002,lp:1400,rvb:.12});
  T(rel,{dur:.35,w:'sine',f:(p.tw??150)*.5,g:p.g*.6,a:.002});
  N(rel+.008,{dur:.14,f:1400,to:4200,ft:'highpass',g:p.g*.4,a:.002,slide:.06});
  if(p.shimmer)T(rel+.03,{dur:.9,f:2100,g:p.g*.08,a:.01,rvb:.4});
}
function fireball(t,p){
  shaped(t,p.drive??5,(sh)=>{
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.playbackRate.value=.7;
    const f=ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(p.hi??2400,t);
    f.frequency.exponentialRampToValueAtTime(p.lo??300,t+p.dur);
    s.connect(sh); sh.connect(f);
    const e=env(t,p.dur,p.g,p.a??.02); f.connect(e); rvb(e,.3);
    s.start(t); s.stop(t+p.dur+.05);
  });
  T(t,{dur:p.dur,f:p.rum??75,to:(p.rum??75)*.6,g:p.g*.7,lp:200,rvb:.2});
  if(p.tone)T(t,{dur:p.dur*.7,w:'sawtooth',f:p.tone,to:p.tone*.4,g:p.g*.25,lp:1200});
  if(p.embers)grains(t+.1,{count:12,span:p.dur*.8,dur:.02,f:2800,q:3,g:p.g*.22,rvb:.2});
  if(p.thump)T(t,{dur:.12,f:120,to:48,g:p.g,a:.002,lp:260});
}
function gun(t,p){
  if(p.crackG)N(t,{dur:.028,f:p.crackF??900,ft:'highpass',g:p.crackG,a:.001});
  T(t,{dur:p.bodyD??.12,f:p.bodyF??150,to:(p.bodyF??150)*.36,g:p.g,a:.001,lp:500});
  if(p.tail)N(t+.015,{dur:p.tail,f:420,to:180,q:.7,g:p.g*.45,a:.008,rvb:.5});
  if(p.zap){
    T(t,{dur:.16,w:'square',f:p.zap,to:p.zap*.16,g:p.g*.6,lp:2600,rvb:.15});
    N(t,{dur:.05,f:3200,ft:'highpass',g:p.g*.3,a:.001});
  }
  if(p.dblBody)T(t+.02,{dur:.16,f:95,to:42,g:p.g*.9,a:.002,lp:300});
  if(p.mech)T(t+.09,{dur:.03,w:'square',f:2100,g:p.g*.12,a:.001});
}

/* climb + crouch one-shots */
function climbFx(t,p){
  switch(p.kind){
    case 'grab':
      N(t,{dur:.05,f:950,q:1,g:p.g*.7,a:.002});
      T(t+.005,{dur:.09,f:120,to:80,g:p.g,lp:320,rvb:.06});
      break;
    case 'cloth':
      N(t,{dur:.16,f:1500,ft:'lowpass',g:p.g*.6,a:.015});
      N(t+.05,{dur:.05,f:900,q:1.2,g:p.g*.5,a:.004});
      T(t+.06,{dur:.07,f:110,to:75,g:p.g*.6,lp:300});
      break;
    case 'scrape':
      N(t,{dur:.3,f:1300,to:700,q:3,g:p.g*.7,a:.02,rate:.5,rvb:.08});
      T(t+.22,{dur:.06,f:130,g:p.g*.5,lp:400});
      break;
    case 'clank':
      T(t,{dur:.18,w:'square',f:330,to:310,g:p.g*.5,lp:1400,rvb:.15});
      T(t,{dur:.5,f:1240,g:p.g*.18,a:.002,rvb:.3});
      T(t+.003,{dur:.08,f:140,to:90,g:p.g*.6,lp:300});
      break;
    case 'rope':
      shaped(t,3,(sh)=>{
        const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=88;
        const l=ctx.createOscillator(); l.frequency.value=26;
        const lg=ctx.createGain(); lg.gain.value=40; l.connect(lg); lg.connect(o.detune);
        const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
        o.connect(sh); sh.connect(f);
        const e=env(t,.32,p.g*.5,.05); f.connect(e);
        o.start(t); o.stop(t+.4); l.start(t); l.stop(t+.4);
      });
      T(t+.2,{dur:.08,f:115,to:85,g:p.g*.5,lp:300});
      break;
  }
}
function crouchFx(t,p){
  switch(p.kind){
    case 'rustle':
      grains(t,{count:10,span:.22,dur:.03,f:1600,ft:'lowpass',q:1,g:p.g*.35});
      break;
    case 'gear':
      grains(t,{count:7,span:.18,dur:.03,f:1500,ft:'lowpass',q:1,g:p.g*.3});
      T(t+.12,{dur:.025,w:'square',f:2500,g:p.g*.2,a:.001});
      break;
    case 'leather':
      N(t,{dur:.26,f:700,q:4.5,g:p.g*.45,a:.05,rate:.4});
      N(t+.16,{dur:.1,f:520,q:4,g:p.g*.3,a:.03,rate:.35});
      break;
    case 'drop':
      N(t,{dur:.08,f:1200,ft:'lowpass',g:p.g*.4,a:.008});
      T(t+.05,{dur:.1,f:105,to:65,g:p.g*.8,lp:280,rvb:.05});
      break;
    case 'swish':
      N(t,{dur:.13,f:600,to:2200,q:1,g:p.g*.5,a:.01,slide:.08});
      N(t+.1,{dur:.09,f:2000,to:700,q:1,g:p.g*.35,a:.008});
      break;
  }
}

/* ═════════════ UI (safe DOM methods, no innerHTML) ═════════════ */
const wrap=document.getElementById('wrap');
let picks={};
try{ picks=JSON.parse(localStorage.getItem('aether.sfx.picks')||'{}'); }catch(e){ picks={}; }
const LETTERS=['A','B','C','D','E'];

function el(tag,cls,text){ const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }

let lastGroup=null;
for(const fx of FX){
  if(fx.group!==lastGroup){ wrap.appendChild(el('h2','group',fx.group)); lastGroup=fx.group; }
  const box=el('div','fx'); box.id='fx-'+fx.id;
  const head=el('div','head');
  head.appendChild(el('h3',null,fx.name));
  head.appendChild(el('span','desc',fx.desc));
  box.appendChild(head);
  const vars=el('div','vars');
  fx.v.forEach((v,i)=>{
    const card=el('div','var'); card.id='var-'+fx.id+'-'+i;
    if(picks[fx.id]===i)card.classList.add('picked');
    const lab=el('div','lab');
    lab.appendChild(el('span','letter',LETTERS[i]));
    lab.appendChild(document.createTextNode(v[0]));
    card.appendChild(lab);
    card.appendChild(el('div','det',v[1]));
    const row=el('div','row');
    const play=el('button','play','▶ Play'); play.id='p-'+fx.id+'-'+i;
    play.addEventListener('click',(ev)=>{ ev.stopPropagation(); AC(); v[2](); });
    const pick=el('button','pick', picks[fx.id]===i?'✓ Picked':'✓ Pick'); pick.id='k-'+fx.id+'-'+i;
    pick.addEventListener('click',(ev)=>{ ev.stopPropagation(); setPick(fx.id,i); });
    row.appendChild(play); row.appendChild(pick);
    card.appendChild(row);
    card.addEventListener('click',()=>{ AC(); v[2](); });
    vars.appendChild(card);
  });
  box.appendChild(vars);
  wrap.appendChild(box);
}

function setPick(id,i){
  picks[id]=i;
  try{ localStorage.setItem('aether.sfx.picks',JSON.stringify(picks)); }catch(e){}
  const fx=FX.find(f=>f.id===id);
  fx.v.forEach((_,j)=>{
    document.getElementById('var-'+id+'-'+j).classList.toggle('picked',j===i);
    document.getElementById('k-'+id+'-'+j).textContent=j===i?'✓ Picked':'✓ Pick';
  });
  sum();
}
function sum(){
  const parts=[]; let n=0;
  for(const fx of FX){ if(picks[fx.id]!==undefined){ n++; parts.push(fx.id+': '+LETTERS[picks[fx.id]]); } }
  const s=document.getElementById('sum');
  s.textContent='';
  s.appendChild(el('b',null,n+' / '+FX.length+' selected'));
  s.appendChild(document.createTextNode(parts.length?' — '+parts.join(' · '):' — none yet'));
}
document.getElementById('copy').addEventListener('click',()=>{
  const parts=[];
  for(const fx of FX){ if(picks[fx.id]!==undefined)parts.push(fx.id+': '+LETTERS[picks[fx.id]]+' ('+fx.v[picks[fx.id]][0]+')'); }
  const txt=parts.length?parts.join('\n'):'(no selections)';
  if(navigator.clipboard)navigator.clipboard.writeText(txt);
  const btn=document.getElementById('copy');
  btn.textContent='Copied!'; setTimeout(()=>{btn.textContent='Copy selections';},1200);
});
sum();

/* meter + test hooks */
let lastRms=0;
(function loop(){
  requestAnimationFrame(loop);
  if(!analyser)return;
  const b=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(b);
  let s2=0; for(let i=0;i<b.length;i++)s2+=b[i]*b[i];
  lastRms=Math.sqrt(s2/b.length);
  document.getElementById('meterfill').style.width=Math.min(100,lastRms*320)+'%';
})();
window.__rms=()=>lastRms;
window.__fx=FX; window.__picks=()=>picks;
window.__play=(id,i)=>{ AC(); FX.find(f=>f.id===id).v[i][2](); };
