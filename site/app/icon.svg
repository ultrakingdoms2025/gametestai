<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aether Nexus">
  <!--
    The gateway ring, in the site's own tokens: --ink-0 ground, --cy ring,
    --amber core. Drawn rather than exported so it stays a few hundred bytes and
    scales to every favicon size a browser asks for. site/public had no icon of
    any kind, so every tab showed the framework's default globe.
  -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="60%" stop-color="#ffb44a"/>
      <stop offset="100%" stop-color="#ffb44a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#04070d"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#52e9ff" stroke-width="3.5" opacity="0.95"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#52e9ff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="32" cy="32" r="11" fill="url(#core)"/>
  <path d="M32 5 L32 14 M32 50 L32 59 M5 32 L14 32 M50 32 L59 32"
        stroke="#52e9ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
